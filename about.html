<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>About | {name}</title>
  <link rel="icon" href="images/logo-icon.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="about">
  <header id="site-header"></header>

  <main>
    <section class="page-hero">
      <h1>About Me</h1>
      <p>Hello there! Let me introduce myself.</p>
    </section>

    <!-- BIO -->
    <section class="section light">
      <div class="wrap about-grid">
        <div class="facts reveal">
          <div class="photo" data-profile-photo="about"></div>
          <h3>Quick Facts</h3>
          <ul id="facts"></ul>
        </div>
        <div class="bio reveal">
          <h2 class="title">Who <span>I Am</span></h2>
          <div id="bio"></div>
          <a href="contact.html" class="btn btn-gold">Let's Talk <i class="fa-solid fa-arrow-right"></i></a>
        </div>
      </div>
    </section>

    <!-- PROMO ADS -->
    <section class="section sky">
      <div class="wrap">
        <h2 class="title">Promo <span>Ads</span></h2>
        <div class="grid" id="promo"></div>
      </div>
    </section>
  </main>

  <footer id="site-footer"></footer>
  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
