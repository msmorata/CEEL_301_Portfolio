<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skills | {name}</title>
  <link rel="icon" href="images/logo-icon.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="skills">
  <header id="site-header"></header>

  <main>
    <section class="page-hero">
      <h1>My Skills</h1>
      <p>Graphic design, programming languages, databases and the tools I use.</p>
    </section>

    <section class="section sky">
      <div class="wrap">
        <h2 class="title">Skill <span>Set</span></h2>
        <div class="skill-groups" id="skill-groups"></div>
        <div class="center" style="margin-top:36px"><a data-github class="btn btn-gold" target="_blank" rel="noopener"><i class="fa-brands fa-github"></i> See My Code on GitHub</a></div>
      </div>
    </section>

    <section class="section light">
      <div class="wrap">
        <h2 class="title center">Languages <span>&amp; Tools</span></h2>
        <div class="tools" id="tools"></div>
      </div>
    </section>
  </main>

  <footer id="site-footer"></footer>
  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
